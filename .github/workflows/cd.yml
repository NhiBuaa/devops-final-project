name: "CD - Deploy to Kubernetes"

on:
  push:
    branches:
      - main
    paths:
      - "app/**"
      - "phase2-k8s/**"

  workflow_dispatch:
    inputs:
      image_tag:
        description: "Docker image tag to deploy (commit SHA)."
        required: true
        type: string
      environment:
        description: "Target environment"
        required: true
        type: choice
        options:
          - staging
          - production
        default: staging

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: false

env:
  DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
  IMAGE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.image_tag || github.sha }}
  KUBECTL_VERSION: "v1.29.4"

jobs:
  check-ci-status:
    name: "Guard - Resolve Deployment Context"
    runs-on: ubuntu-latest

    outputs:
      image_tag: ${{ steps.resolve-tag.outputs.tag }}
      should_deploy: ${{ steps.resolve-tag.outputs.should_deploy }}
      target_environment: ${{ steps.resolve-tag.outputs.target_environment }}

    steps:
      - name: "Resolve image tag"
        id: resolve-tag
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            TAG="${{ inputs.image_tag }}"
            TARGET_ENVIRONMENT="${{ inputs.environment }}"
          else
            TAG="${{ github.sha }}"
            TARGET_ENVIRONMENT="production"
          fi

          if [ -z "$TAG" ]; then
            echo "Cannot resolve image tag!"
            exit 1
          fi

          if [ "$TARGET_ENVIRONMENT" != "staging" ] && [ "$TARGET_ENVIRONMENT" != "production" ]; then
            echo "Invalid target environment: $TARGET_ENVIRONMENT"
            exit 1
          fi

          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "target_environment=$TARGET_ENVIRONMENT" >> $GITHUB_OUTPUT
          echo "should_deploy=true" >> $GITHUB_OUTPUT
          echo "Resolved image tag: $TAG"
          echo "Target environment: $TARGET_ENVIRONMENT"

      - name: "Log deployment intent"
        run: |
          echo "## CD Pipeline Triggered" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Field | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Image Tag | \`${{ steps.resolve-tag.outputs.tag }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Target Environment | \`${{ steps.resolve-tag.outputs.target_environment }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Triggered by | ${{ github.actor }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Trigger | ${{ github.event_name }} |" >> $GITHUB_STEP_SUMMARY

  deploy-staging:
    name: "Deploy -> Staging"
    runs-on: ubuntu-latest
    needs: check-ci-status
    if: needs.check-ci-status.outputs.should_deploy == 'true' && (needs.check-ci-status.outputs.target_environment == 'staging' || needs.check-ci-status.outputs.target_environment == 'production')
    environment:
      name: staging
      url: https://staging.nhibuaa.space

    env:
      IMAGE_TAG: ${{ needs.check-ci-status.outputs.image_tag }}
      K8S_NAMESPACE: staging

    steps:
      - name: "Checkout source code"
        uses: actions/checkout@v4

      - name: "Setup kubectl ${{ env.KUBECTL_VERSION }}"
        uses: azure/setup-kubectl@v4
        with:
          version: ${{ env.KUBECTL_VERSION }}

      - name: "Login to Docker Hub"
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: "Configure kubeconfig"
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBECONFIG_B64 }}" | base64 -d > ~/.kube/config
          chmod 600 ~/.kube/config

          kubectl cluster-info
          kubectl get nodes

      - name: "Snapshot production state before staging deploy"
        id: production-before-staging
        if: needs.check-ci-status.outputs.target_environment == 'staging'
        run: |
          FRONTEND_IMAGE=$(kubectl get deployment frontend -n production -o jsonpath='{.spec.template.spec.containers[0].image}' 2>/dev/null || true)
          BACKEND_IMAGE=$(kubectl get deployment backend -n production -o jsonpath='{.spec.template.spec.containers[0].image}' 2>/dev/null || true)

          echo "frontend_image=$FRONTEND_IMAGE" >> $GITHUB_OUTPUT
          echo "backend_image=$BACKEND_IMAGE" >> $GITHUB_OUTPUT
          echo "Production frontend before staging: ${FRONTEND_IMAGE:-<missing>}"
          echo "Production backend before staging: ${BACKEND_IMAGE:-<missing>}"

      - name: "Resolve ingress class (staging)"
        run: |
          if kubectl get ingressclass traefik >/dev/null 2>&1; then
            INGRESS_CLASS="traefik"
          elif kubectl get ingressclass nginx >/dev/null 2>&1; then
            INGRESS_CLASS="nginx"
          else
            echo "No supported IngressClass found. Available classes:"
            kubectl get ingressclass -o wide || true
            exit 1
          fi

          echo "Using IngressClass: ${INGRESS_CLASS}"
          sed -i "s/ingressClassName: .*/ingressClassName: ${INGRESS_CLASS}/g" \
            phase2-k8s/ingress/ingress-staging.yaml
          sed -i "s|acme.cert-manager.io/http01-ingress-class: .*|acme.cert-manager.io/http01-ingress-class: \"${INGRESS_CLASS}\"|g" \
            phase2-k8s/ingress/ingress-staging.yaml

      - name: "Ensure staging namespace exists"
        run: |
          kubectl create namespace staging --dry-run=client -o yaml | kubectl apply -f -
          kubectl label namespace staging environment=staging --overwrite

      - name: "Verify Docker images exist for staging"
        run: |
          for image in final-devops-frontend final-devops-backend; do
            REPO="${{ env.DOCKER_USERNAME }}/$image"
            FOUND=false
            for attempt in $(seq 1 20); do
              echo "Checking Docker Hub tag: $REPO:${{ env.IMAGE_TAG }} (attempt $attempt/20)"
              if docker manifest inspect "$REPO:${{ env.IMAGE_TAG }}" > /dev/null 2>&1; then
                FOUND=true
                break
              fi

              echo "Image not available yet, waiting 30s for CI push to complete..."
              sleep 30
            done

            if [ "$FOUND" != "true" ]; then
              echo "Missing image tag after waiting: $REPO:${{ env.IMAGE_TAG }}"
              exit 1
            fi
          done

      - name: "Update image tags in manifests"
        run: |
          sed -i "s|thongchau/final-devops-frontend:.*|${{ env.DOCKER_USERNAME }}/final-devops-frontend:${{ env.IMAGE_TAG }}|g" \
            phase2-k8s/frontend/deployment.yaml

          sed -i "s|thongchau/final-devops-backend:.*|${{ env.DOCKER_USERNAME }}/final-devops-backend:${{ env.IMAGE_TAG }}|g" \
            phase2-k8s/backend/deployment.yaml

          echo "Frontend image:"
          grep "image:" phase2-k8s/frontend/deployment.yaml

          echo "Backend image:"
          grep "image:" phase2-k8s/backend/deployment.yaml

      - name: "Apply ConfigMaps and Secrets (staging)"
        run: |
          kubectl delete secret backend-secret -n staging --ignore-not-found

          kubectl create secret generic backend-secret \
            --namespace=staging \
            --from-literal=DB_USER="${{ secrets.STAGING_DB_USER }}" \
            --from-literal=DB_PASSWORD="${{ secrets.STAGING_DB_PASSWORD }}" \
            --from-literal=JWT_SECRET="${{ secrets.STAGING_JWT_SECRET }}" \
            --dry-run=client -o yaml | kubectl apply -f -

          kubectl apply -f phase2-k8s/frontend/configmap.yaml -n staging
          kubectl apply -f phase2-k8s/backend/configmap.yaml -n staging

      - name: "Deploy Database (staging)"
        run: |
          kubectl apply -f phase2-k8s/database/statefulset.yaml -n staging

          kubectl wait pod \
            --namespace=staging \
            --selector=app=postgres \
            --for=condition=Ready \
            --timeout=120s

      - name: "Rolling update - Backend (staging)"
        run: |
          kubectl apply -f phase2-k8s/backend/deployment.yaml -n staging

          if ! kubectl rollout status deployment/backend \
              --namespace=staging \
              --timeout=180s; then
            echo "Backend rollout failed. Collecting diagnostics..."
            kubectl get pods -n staging -l app=backend -o wide || true
            kubectl describe deployment/backend -n staging || true
            kubectl describe pods -n staging -l app=backend || true
            kubectl logs -n staging -l app=backend --tail=100 || true
            exit 1
          fi

      - name: "Rolling update - Frontend (staging)"
        run: |
          kubectl apply -f phase2-k8s/frontend/deployment.yaml -n staging
          kubectl apply -f phase2-k8s/frontend/hpa.yaml -n staging

          if ! kubectl rollout status deployment/frontend \
              --namespace=staging \
              --timeout=180s; then
            echo "Frontend rollout failed. Collecting diagnostics..."
            kubectl get pods -n staging -l app=frontend -o wide || true
            kubectl describe deployment/frontend -n staging || true
            kubectl describe pods -n staging -l app=frontend || true
            kubectl logs -n staging -l app=frontend --tail=100 || true
            exit 1
          fi

      - name: "Apply Ingress (staging)"
        run: |
          kubectl apply -f phase2-k8s/ingress/ingress-staging.yaml -n staging

      - name: "Wait for TLS certificate (staging)"
        run: |
          echo "Waiting for cert-manager to create tls-staging-cert..."
          for i in $(seq 1 30); do
            if kubectl get certificate tls-staging-cert -n staging >/dev/null 2>&1; then
              break
            fi
            echo "Certificate not created yet, waiting 10s... ($i/30)"
            sleep 10
          done

          if ! kubectl wait certificate/tls-staging-cert \
              --namespace=staging \
              --for=condition=Ready \
              --timeout=300s; then
            echo "TLS certificate was not ready. Collecting cert-manager diagnostics..."
            kubectl describe certificate tls-staging-cert -n staging || true
            kubectl get certificaterequests,orders,challenges -n staging -o wide || true
            kubectl describe ingress staging-ingress -n staging || true
            exit 1
          fi

      - name: "Inspect ingress routing (staging)"
        run: |
          echo "Ingress classes:"
          kubectl get ingressclass -o wide || true

          echo "Ingress controllers:"
          kubectl get pods -A -o wide | grep -E "ingress|traefik|cert-manager" || true
          kubectl get svc -A -o wide | grep -E "ingress|traefik" || true

          echo "Staging ingress and certificate:"
          kubectl get ingress staging-ingress -n staging -o wide || true
          kubectl describe ingress staging-ingress -n staging || true
          kubectl get certificate tls-staging-cert -n staging -o wide || true
          kubectl get secret tls-staging-cert -n staging || true

      - name: "Post-deploy health check (staging)"
        id: staging-health
        run: |
          echo "Waiting 15s for ingress routing to settle..."
          sleep 15

          NOT_READY=$(kubectl get pods -n staging --no-headers | grep -v "Running" | grep -v "Completed" | wc -l)

          if [ "$NOT_READY" -gt "0" ]; then
            echo "There are $NOT_READY pod(s) not running yet."
            kubectl get pods -n staging
            exit 1
          fi

          HTTP_STATUS=$(curl -sS -o /dev/null -w "%{http_code}" \
            https://staging.nhibuaa.space/healthz || echo "000")

          if [ "$HTTP_STATUS" != "200" ]; then
            echo "Health check failed. HTTP status: $HTTP_STATUS"
            echo "Curl diagnostics:"
            curl -Iv https://staging.nhibuaa.space/healthz || true
            exit 1
          fi

          echo "Staging health check passed (HTTP $HTTP_STATUS)"

      - name: "Verify production was not changed by staging deploy"
        if: needs.check-ci-status.outputs.target_environment == 'staging'
        run: |
          BEFORE_FRONTEND="${{ steps.production-before-staging.outputs.frontend_image }}"
          BEFORE_BACKEND="${{ steps.production-before-staging.outputs.backend_image }}"
          AFTER_FRONTEND=$(kubectl get deployment frontend -n production -o jsonpath='{.spec.template.spec.containers[0].image}' 2>/dev/null || true)
          AFTER_BACKEND=$(kubectl get deployment backend -n production -o jsonpath='{.spec.template.spec.containers[0].image}' 2>/dev/null || true)

          echo "Production frontend before: ${BEFORE_FRONTEND:-<missing>}"
          echo "Production frontend after:  ${AFTER_FRONTEND:-<missing>}"
          echo "Production backend before:  ${BEFORE_BACKEND:-<missing>}"
          echo "Production backend after:   ${AFTER_BACKEND:-<missing>}"

          if [ "$BEFORE_FRONTEND" != "$AFTER_FRONTEND" ] || [ "$BEFORE_BACKEND" != "$AFTER_BACKEND" ]; then
            echo "Production changed during a staging-only deployment. Blocking the pipeline."
            exit 1
          fi

      - name: "Auto rollback - Staging (on failure)"
        if: failure()
        run: |
          echo "Staging deployment failed. Starting automatic rollback..."

          kubectl rollout undo deployment/frontend --namespace=staging || echo "No previous frontend revision to roll back to"
          kubectl rollout undo deployment/backend --namespace=staging || echo "No previous backend revision to roll back to"

          kubectl rollout status deployment/frontend --namespace=staging --timeout=120s || true
          kubectl rollout status deployment/backend --namespace=staging --timeout=120s || true

          echo "Rollback sequence completed!"
          echo "Staging deployment failed and was rolled back" >> $GITHUB_STEP_SUMMARY
          exit 1

      - name: "Staging deployment summary"
        if: success()
        run: |
          echo "## Staging Deployment Successful" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Field | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Environment | Staging |" >> $GITHUB_STEP_SUMMARY
          echo "| Image Tag | \`${{ env.IMAGE_TAG }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| URL | https://staging.nhibuaa.space |" >> $GITHUB_STEP_SUMMARY
          echo "| Deployed by | ${{ github.actor }} |" >> $GITHUB_STEP_SUMMARY
          kubectl get pods -n staging >> $GITHUB_STEP_SUMMARY || true

  await-approval:
    name: "Await Manual Approval for Production"
    runs-on: ubuntu-latest
    needs:
      - check-ci-status
      - deploy-staging
    if: needs.check-ci-status.outputs.target_environment == 'production'
    environment:
      name: production-approval

    steps:
      - name: "Production deployment awaiting approval"
        run: |
          echo "=============================================="
          echo "WAITING FOR MANUAL APPROVAL"
          echo "=============================================="
          echo "Staging URL: https://staging.nhibuaa.space"
          echo "Image Tag:   ${{ needs.check-ci-status.outputs.image_tag }}"
          echo ""
          echo "Please review staging and approve in GitHub:"
          echo "Repo -> Environments -> production-approval -> Review deployments"
          echo "=============================================="

          echo "## Awaiting Production Approval" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Reviewer:** Go to Actions -> This run -> Review pending deployments" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Staging URL to verify:** https://staging.nhibuaa.space" >> $GITHUB_STEP_SUMMARY

  deploy-production:
    name: "Deploy -> Production"
    runs-on: ubuntu-latest
    needs:
      - check-ci-status
      - await-approval
    if: needs.check-ci-status.outputs.target_environment == 'production'
    environment:
      name: production
      url: https://app.nhibuaa.space

    env:
      IMAGE_TAG: ${{ needs.check-ci-status.outputs.image_tag }}
      K8S_NAMESPACE: production

    steps:
      - name: "Checkout source code"
        uses: actions/checkout@v4

      - name: "Setup kubectl"
        uses: azure/setup-kubectl@v4
        with:
          version: ${{ env.KUBECTL_VERSION }}

      - name: "Login to Docker Hub"
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: "Configure kubeconfig"
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBECONFIG_B64 }}" | base64 -d > ~/.kube/config
          chmod 600 ~/.kube/config
          kubectl cluster-info

      - name: "Resolve ingress class (production)"
        run: |
          if kubectl get ingressclass traefik >/dev/null 2>&1; then
            INGRESS_CLASS="traefik"
          elif kubectl get ingressclass nginx >/dev/null 2>&1; then
            INGRESS_CLASS="nginx"
          else
            echo "No supported IngressClass found. Available classes:"
            kubectl get ingressclass -o wide || true
            exit 1
          fi

          echo "Using IngressClass: ${INGRESS_CLASS}"
          sed -i "s/ingressClassName: .*/ingressClassName: ${INGRESS_CLASS}/g" \
            phase2-k8s/ingress/ingress.yaml
          sed -i "s|acme.cert-manager.io/http01-ingress-class: .*|acme.cert-manager.io/http01-ingress-class: \"${INGRESS_CLASS}\"|g" \
            phase2-k8s/ingress/ingress.yaml

      - name: "Ensure production namespace exists"
        run: |
          kubectl apply -f phase2-k8s/namespace.yaml

      - name: "Verify Docker images exist for production"
        run: |
          for image in final-devops-frontend final-devops-backend; do
            REPO="${{ env.DOCKER_USERNAME }}/$image"
            FOUND=false
            for attempt in $(seq 1 20); do
              echo "Checking Docker Hub tag: $REPO:${{ env.IMAGE_TAG }} (attempt $attempt/20)"
              if docker manifest inspect "$REPO:${{ env.IMAGE_TAG }}" > /dev/null 2>&1; then
                FOUND=true
                break
              fi

              echo "Image not available yet, waiting 30s for CI push to complete..."
              sleep 30
            done

            if [ "$FOUND" != "true" ]; then
              echo "Missing image tag after waiting: $REPO:${{ env.IMAGE_TAG }}"
              exit 1
            fi
          done

      - name: "Snapshot current state (for rollback reference)"
        id: snapshot
        run: |
          FRONTEND_REV=$(kubectl rollout history deployment/frontend -n production --no-headers 2>/dev/null | tail -1 | awk '{print $1}')
          BACKEND_REV=$(kubectl rollout history deployment/backend -n production --no-headers 2>/dev/null | tail -1 | awk '{print $1}')

          echo "frontend_revision=${FRONTEND_REV:-0}" >> $GITHUB_OUTPUT
          echo "backend_revision=${BACKEND_REV:-0}" >> $GITHUB_OUTPUT

          echo "Current frontend revision: ${FRONTEND_REV:-0}"
          echo "Current backend revision: ${BACKEND_REV:-0}"

      - name: "Update image tags in manifests"
        run: |
          sed -i "s|thongchau/final-devops-frontend:.*|${{ env.DOCKER_USERNAME }}/final-devops-frontend:${{ env.IMAGE_TAG }}|g" \
            phase2-k8s/frontend/deployment.yaml
          sed -i "s|thongchau/final-devops-backend:.*|${{ env.DOCKER_USERNAME }}/final-devops-backend:${{ env.IMAGE_TAG }}|g" \
            phase2-k8s/backend/deployment.yaml

      - name: "Apply ConfigMaps and Secrets (production)"
        run: |
          kubectl create secret generic backend-secret \
            --namespace=production \
            --from-literal=DB_USER="${{ secrets.PROD_DB_USER }}" \
            --from-literal=DB_PASSWORD="${{ secrets.PROD_DB_PASSWORD }}" \
            --from-literal=JWT_SECRET="${{ secrets.PROD_JWT_SECRET }}" \
            --dry-run=client -o yaml | kubectl apply -f -

          kubectl apply -f phase2-k8s/frontend/configmap.yaml -n production
          kubectl apply -f phase2-k8s/backend/configmap.yaml -n production

      - name: "Rolling update - Backend (production)"
        id: deploy-backend
        run: |
          echo "Deploying backend image: ${{ env.DOCKER_USERNAME }}/backend:${{ env.IMAGE_TAG }}"

          kubectl apply -f phase2-k8s/backend/deployment.yaml -n production
          kubectl apply -f phase2-k8s/backend/hpa.yaml -n production

          if ! kubectl rollout status deployment/backend \
              --namespace=production \
              --timeout=300s; then
            echo "backend_failed=true" >> $GITHUB_OUTPUT
            exit 1
          fi

          echo "backend_failed=false" >> $GITHUB_OUTPUT
          echo "Backend rolling update completed"

      - name: "Rolling update - Frontend (production)"
        id: deploy-frontend
        run: |
          echo "Deploying frontend image: ${{ env.DOCKER_USERNAME }}/frontend:${{ env.IMAGE_TAG }}"

          kubectl apply -f phase2-k8s/frontend/deployment.yaml -n production
          kubectl apply -f phase2-k8s/frontend/hpa.yaml -n production

          if ! kubectl rollout status deployment/frontend \
              --namespace=production \
              --timeout=300s; then
            echo "frontend_failed=true" >> $GITHUB_OUTPUT
            exit 1
          fi

          echo "frontend_failed=false" >> $GITHUB_OUTPUT
          echo "Frontend rolling update completed"

      - name: "Apply Ingress (production)"
        run: |
          kubectl delete ingress main-ingress -n default --ignore-not-found
          kubectl delete ingress monitoring-ingress -n default --ignore-not-found
          kubectl apply -f phase2-k8s/ingress/ingress.yaml

      - name: "Wait for TLS certificate (production)"
        run: |
          echo "Waiting for cert-manager to create tls-production-cert..."
          for i in $(seq 1 30); do
            if kubectl get certificate tls-production-cert -n production >/dev/null 2>&1; then
              break
            fi
            echo "Certificate not created yet, waiting 10s... ($i/30)"
            sleep 10
          done

          if ! kubectl wait certificate/tls-production-cert \
              --namespace=production \
              --for=condition=Ready \
              --timeout=300s; then
            echo "TLS certificate was not ready. Collecting cert-manager diagnostics..."
            kubectl describe certificate tls-production-cert -n production || true
            kubectl get certificaterequests,orders,challenges -n production -o wide || true
            kubectl describe ingress main-ingress -n production || true
            exit 1
          fi

      - name: "Inspect ingress routing (production)"
        run: |
          echo "Ingress classes:"
          kubectl get ingressclass -o wide || true

          echo "Ingress controllers:"
          kubectl get pods -A -o wide | grep -E "ingress|traefik|cert-manager" || true
          kubectl get svc -A -o wide | grep -E "ingress|traefik" || true

          echo "Production ingress and certificate:"
          kubectl get ingress main-ingress -n production -o wide || true
          kubectl describe ingress main-ingress -n production || true
          kubectl get certificate tls-production-cert -n production -o wide || true
          kubectl get secret tls-production-cert -n production || true

      - name: "Post-deploy health check (production)"
        id: prod-health
        run: |
          echo "Waiting 15s for production routing to settle..."
          sleep 15

          NOT_READY=$(kubectl get pods -n production --no-headers | grep -v "Running" | grep -v "Completed" | wc -l)

          if [ "$NOT_READY" -gt "0" ]; then
            echo "Warning: $NOT_READY pod(s) are not ready yet."
            kubectl get pods -n production
            exit 1
          fi

          echo "Pod status check passed"

          for DOMAIN in app.nhibuaa.space nhibuaa.space; do
            HTTP_STATUS="000"
            for i in 1 2 3; do
              HTTP_STATUS=$(curl -sS -o /dev/null -w "%{http_code}" \
                "https://${DOMAIN}/healthz" || echo "000")
              if [ "$HTTP_STATUS" == "200" ]; then
                echo "Health check ${DOMAIN} $i/3 passed (HTTP $HTTP_STATUS)"
                break
              fi
              echo "Health check ${DOMAIN} $i/3 returned HTTP $HTTP_STATUS, retrying in 15s..."
              sleep 15
            done

            if [ "$HTTP_STATUS" != "200" ]; then
              echo "Production health check failed for ${DOMAIN} after 3 attempts"
              echo "Curl diagnostics for ${DOMAIN}:"
              curl -Iv "https://${DOMAIN}/healthz" || true
              exit 1
            fi
          done

      - name: "Auto rollback - Production (on failure)"
        if: failure()
        run: |
          echo "Production deployment failed. Initiating rollback."

          if [ "${{ steps.snapshot.outputs.frontend_revision }}" != "0" ] && [ -n "${{ steps.snapshot.outputs.frontend_revision }}" ]; then
            kubectl rollout undo deployment/frontend --namespace=production --to-revision=${{ steps.snapshot.outputs.frontend_revision }}
          else
            kubectl rollout undo deployment/frontend --namespace=production || echo "No history to rollback"
          fi

          if [ "${{ steps.snapshot.outputs.backend_revision }}" != "0" ] && [ -n "${{ steps.snapshot.outputs.backend_revision }}" ]; then
            kubectl rollout undo deployment/backend --namespace=production --to-revision=${{ steps.snapshot.outputs.backend_revision }}
          else
            kubectl rollout undo deployment/backend --namespace=production || echo "No history to rollback"
          fi

          kubectl rollout status deployment/frontend --namespace=production --timeout=180s || true
          kubectl rollout status deployment/backend --namespace=production --timeout=180s || true

          echo "Production rolled back successfully!"
          exit 1

      - name: "Production deployment summary"
        if: success()
        run: |
          echo "## Production Deployment Successful" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Field | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Environment | Production |" >> $GITHUB_STEP_SUMMARY
          echo "| Image Tag | \`${{ env.IMAGE_TAG }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| URL | https://app.nhibuaa.space |" >> $GITHUB_STEP_SUMMARY
          echo "| Approved by | ${{ github.actor }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          kubectl get pods -n production -o wide >> $GITHUB_STEP_SUMMARY || true
          echo "" >> $GITHUB_STEP_SUMMARY
          kubectl get hpa -n production >> $GITHUB_STEP_SUMMARY || true

  notify:
    name: "Notify Deployment Result"
    runs-on: ubuntu-latest
    needs: [deploy-staging, deploy-production]
    if: always()

    steps:
      - name: "Deployment result notification"
        run: |
          STAGING_STATUS="${{ needs.deploy-staging.result }}"
          PROD_STATUS="${{ needs.deploy-production.result }}"

          echo "=============================================="
          echo "DEPLOYMENT RESULT"
          echo "=============================================="
          echo "Staging:    $STAGING_STATUS"
          echo "Production: $PROD_STATUS"
          echo "Image Tag:  ${{ env.IMAGE_TAG }}"
          echo "=============================================="
