# =============================================================================
# CI Pipeline — Backend (Node.js / Spring Boot)
#
# Trigger: push vào main/develop, PR vào main
# Stages: lint -> test -> build -> security scan (code + image) -> docker push
# =============================================================================

name: "CI — Backend and Security"

on:
  push:
    branches:
      - main
      - develop
    paths:
      - "backend/**"
      - ".github/workflows/ci-backend.yml"
  pull_request:
    branches:
      - main
    paths:
      - "backend/**"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: ${{ secrets.DOCKER_USERNAME }}/backend
  IMAGE_TAG: ${{ github.sha }}
  NODE_VERSION: "20"

jobs:
  # ──────────────────────────────────────────────────────────────────────────
  # JOB 1: Lint + Test + Code Security Scan (SAST)
  # ──────────────────────────────────────────────────────────────────────────
  lint-test-scan:
    name: "Lint, Test & SAST"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend

    services:
      # Spin up PostgreSQL service container để integration tests chạy được
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: testuser
          POSTGRES_PASSWORD: testpass
          POSTGRES_DB: testdb
        ports:
          - 5432:5432
        # Chờ PostgreSQL healthy trước khi chạy tests
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: "Checkout source code"
        uses: actions/checkout@v4

      - name: "Setup Node.js ${{ env.NODE_VERSION }}"
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: backend/package-lock.json

      - name: "Cache node_modules"
        id: cache-node-modules
        uses: actions/cache@v4
        with:
          path: backend/node_modules
          key: node-modules-backend-${{ runner.os }}-${{ env.NODE_VERSION }}-${{ hashFiles('backend/package-lock.json') }}
          restore-keys: |
            node-modules-backend-${{ runner.os }}-${{ env.NODE_VERSION }}-

      - name: "Install dependencies"
        if: steps.cache-node-modules.outputs.cache-hit != 'true'
        run: npm ci --frozen-lockfile

      - name: "Run ESLint"
        run: npm run lint
        # Fail nếu có linting errors — bắt buộc clean code

      - name: "Run tests (unit + integration)"
        run: npm run test:ci
        env:
          CI: true
          NODE_ENV: test
          # Kết nối vào PostgreSQL service container ở trên
          DB_HOST: localhost
          DB_PORT: 5432
          DB_USER: testuser
          DB_PASSWORD: testpass
          DB_NAME: testdb
          JWT_SECRET: test-jwt-secret-not-real

      - name: "Upload test coverage"
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-coverage-${{ github.sha }}
          path: backend/coverage/
          retention-days: 7

      # ── SAST: Source code security scan (detect hardcoded secrets, etc.) ───
      - name: "SAST scan with Trivy (filesystem)"
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: "fs"           # Scan filesystem (source code + deps)
          scan-ref: "./backend"
          trivyignores: "./runtime/.trivyignore"
          format: "table"
          exit-code: "1"
          severity: "CRITICAL,HIGH"
          ignore-unfixed: true
          # Phát hiện: hardcoded secrets, known vulnerable npm packages,
          # misconfiguration trong Dockerfile, etc.

  # ──────────────────────────────────────────────────────────────────────────
  # JOB 2: Build Application
  # ──────────────────────────────────────────────────────────────────────────
  build:
    name: "Build App"
    runs-on: ubuntu-latest
    needs: lint-test-scan
    defaults:
      run:
        working-directory: ./backend

    steps:
      - name: "Checkout source code"
        uses: actions/checkout@v4

      - name: "Setup Node.js ${{ env.NODE_VERSION }}"
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: backend/package-lock.json

      - name: "Restore node_modules cache"
        id: cache-node-modules
        uses: actions/cache@v4
        with:
          path: backend/node_modules
          key: node-modules-backend-${{ runner.os }}-${{ env.NODE_VERSION }}-${{ hashFiles('backend/package-lock.json') }}

      - name: "Install dependencies (if cache miss)"
        if: steps.cache-node-modules.outputs.cache-hit != 'true'
        run: npm ci --frozen-lockfile

      - name: "Build TypeScript → JavaScript"
        run: npm run build
        env:
          NODE_ENV: production

      - name: "Upload build artifact"
        uses: actions/upload-artifact@v4
        with:
          name: backend-build-${{ github.sha }}
          path: backend/dist/
          retention-days: 1

  # ──────────────────────────────────────────────────────────────────────────
  # JOB 3: Docker Build, Image Scan & Push
  # ──────────────────────────────────────────────────────────────────────────
  docker-build-push:
    name: "Docker Build, Scan & Push"
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push'

    # Outputs: cho CD pipeline đọc được image tag
    outputs:
      image-tag: ${{ steps.meta.outputs.tags }}
      image-digest: ${{ steps.push.outputs.digest }}

    steps:
      - name: "Checkout source code"
        uses: actions/checkout@v4

      - name: "Setup Docker Buildx"
        uses: docker/setup-buildx-action@v3

      - name: "Cache Docker build layers"
        uses: actions/cache@v4
        with:
          path: /tmp/.buildx-cache
          key: buildx-backend-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            buildx-backend-${{ runner.os }}-

      - name: "Generate Docker metadata & tags"
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            # Tag bằng commit SHA đầy đủ (immutable — dùng trong CD)
            type=sha,format=long,prefix=
            # Tag bằng branch name (mutable — dùng cho reference)
            type=ref,event=branch
            # Tag bằng PR number (chỉ cho PR runs)
            type=ref,event=pr
          # KHÔNG có type=raw,value=latest → đúng yêu cầu rubric!

      - name: "Login to Docker Hub"
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      # ── Build image để scan (chưa push) ─────────────────────────────────────
      - name: "Build Docker image (pre-scan)"
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: false
          load: true
          tags: ${{ env.IMAGE_NAME }}:scan-${{ env.IMAGE_TAG }}
          cache-from: type=local,src=/tmp/.buildx-cache
          cache-to: type=local,dest=/tmp/.buildx-cache-new,mode=max

      # ── Container Image Scan với Trivy ──────────────────────────────────────
      - name: "Scan Docker image with Trivy"
        id: trivy-scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.IMAGE_NAME }}:scan-${{ env.IMAGE_TAG }}
          trivyignores: "./runtime/.trivyignore"
          format: "table"
          exit-code: "1"
          ignore-unfixed: true
          severity: "CRITICAL,HIGH"
          # Scan layers: OS packages (Alpine), npm packages, binary vulnerabilities
          vuln-type: "os,library"
          # Timeout dài hơn vì backend image phức tạp hơn
          timeout: "10m"

      - name: "Upload Trivy SARIF report"
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trivy-backend-report-${{ github.sha }}
          path: trivy-backend.sarif
          retention-days: 30

      # ── Chỉ push nếu scan PASS ──────────────────────────────────────────────
      - name: "Build & Push verified image to Docker Hub"
        id: push
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=local,src=/tmp/.buildx-cache
          cache-to: type=local,dest=/tmp/.buildx-cache-new,mode=max
          # Provenance: tạo attestation cho image (supply chain security)
          provenance: true

      - name: "Rotate Docker build cache"
        run: |
          rm -rf /tmp/.buildx-cache
          mv /tmp/.buildx-cache-new /tmp/.buildx-cache

      - name: "Write job summary"
        run: |
          echo "## CI Pipeline — Backend" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Field | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Image | \`${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Digest | \`${{ steps.push.outputs.digest }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Commit | \`${{ github.sha }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Branch | \`${{ github.ref_name }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Triggered by | ${{ github.actor }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Security scan | PASSED |" >> $GITHUB_STEP_SUMMARY
          echo "| Image digest | \`${{ steps.push.outputs.digest }}\` |" >> $GITHUB_STEP_SUMMARY
