[defaults]
inventory           = ./inventory/hosts.ini
remote_user         = ubuntu
host_key_checking   = False
retry_files_enabled = False
stdout_callback     = ansible.builtin.default
callbacks_enabled   = timer, profile_tasks
private_key_file = ~/.ssh/devops-final.pem

# Tăng timeout cho các operations nặng (cài K3s, cert-manager...)
timeout = 60

# Số lượng parallel connections
forks = 5

# Logging - quan trọng để prove idempotency
log_path = ./ansible.log

[ssh_connection]
ssh_args = -o ControlMaster=auto -o ControlPersist=60s -o StrictHostKeyChecking=no
pipelining = True

[callback_default]
result_format = yaml