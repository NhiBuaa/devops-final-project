---
# =============================================================================
# Global Variables cho toàn bộ Ansible Playbook
# =============================================================================

letsencrypt_email: "nhihuynh210905@gmail.com" # Email để nhận thông báo từ Let's Encrypt
domain_name: "nhibuaa.space"

# K3s version (ghim version cụ thể để đảm bảo idempotency)
k3s_version: "v1.29.4+k3s1"

# Helm version
helm_version: "v3.14.4"

# cert-manager version
cert_manager_version: "v1.14.5"

# User mặc định của Ubuntu AMI
ansible_user: ubuntu

# Thư mục lưu kubeconfig
kubeconfig_dir: "/home/ubuntu/.kube"
kubeconfig_path: "/home/ubuntu/.kube/config"

# K3s config directory
k3s_config_dir: "/etc/rancher/k3s"
k3s_token_file: "/var/lib/rancher/k3s/server/node-token"

# UFW - Firewall rules
ufw_allowed_ports:
  - { port: 22, proto: tcp, comment: "SSH" }
  - { port: 80, proto: tcp, comment: "HTTP" }
  - { port: 443, proto: tcp, comment: "HTTPS" }
  - { port: 6443, proto: tcp, comment: "Kubernetes API Server" }
  - { port: 8472, proto: udp, comment: "K3s Flannel VXLAN" }
  - { port: 10250, proto: tcp, comment: "Kubelet metrics" }
  - { port: 9090, proto: tcp, comment: "Prometheus" }
  - { port: 32000, proto: tcp, comment: "Grafana" }
  - { port: "30000:32767", proto: tcp, comment: "NodePort range" }

# Internal VPC CIDR - cho phép tất cả traffic nội bộ
vpc_cidr: "10.0.0.0/16"