apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: devops-final-alerts
  namespace: monitoring
  labels:
    app: kube-prometheus-stack
    release: kube-prometheus-stack    # Phải match label selector của Prometheus
spec:
  groups:
    # ── POD HEALTH ALERTS ────────────────────────────────────────────────────
    - name: pod-health
      interval: 30s
      rules:
        - alert: PodCrashLooping
          expr: |
            rate(kube_pod_container_status_restarts_total{namespace=~"production|staging"}[5m]) > 0
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "Pod {{ $labels.pod }} is crash looping"
            description: |
              Pod {{ $labels.pod }} in namespace {{ $labels.namespace }}
              has restarted {{ $value | humanize }} times in the last 5 minutes.

        - alert: PodNotReady
          expr: |
            kube_pod_status_ready{condition="true", namespace=~"production|staging"} == 0
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "Pod {{ $labels.pod }} is not ready"
            description: "Pod {{ $labels.pod }} in {{ $labels.namespace }} has been not ready for 5 minutes."

        - alert: DeploymentReplicasMismatch
          expr: |
            kube_deployment_spec_replicas{namespace=~"production|staging"}
            != kube_deployment_status_available_replicas{namespace=~"production|staging"}
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "Deployment {{ $labels.deployment }} has mismatched replicas"
            description: "Deployment {{ $labels.deployment }} has {{ $value }} available replicas, expected more."

    # ── NODE RESOURCE ALERTS ─────────────────────────────────────────────────
    - name: node-resources
      interval: 60s
      rules:
        - alert: NodeCPUHigh
          expr: |
            100 - (avg by(instance) (rate(node_cpu_seconds_total{mode="idle"}[5m])) * 100) > 80
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "Node {{ $labels.instance }} CPU usage is high"
            description: "Node CPU usage is {{ $value | humanize }}% (threshold: 80%)"

        - alert: NodeMemoryHigh
          expr: |
            (1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)) * 100 > 85
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "Node {{ $labels.instance }} memory usage is high"
            description: "Node memory usage is {{ $value | humanize }}% (threshold: 85%)"

        - alert: NodeDiskSpaceLow
          expr: |
            (1 - (node_filesystem_avail_bytes{mountpoint="/"} / node_filesystem_size_bytes{mountpoint="/"})) * 100 > 80
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "Node {{ $labels.instance }} disk space low"
            description: "Disk usage is {{ $value | humanize }}% on {{ $labels.instance }}"

    # ── APPLICATION ALERTS ───────────────────────────────────────────────────
    - name: application
      interval: 30s
      rules:
        - alert: BackendHighErrorRate
          expr: |
            rate(http_requests_total{namespace="production", status=~"5.."}[5m])
            / rate(http_requests_total{namespace="production"}[5m]) > 0.05
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "Backend error rate > 5%"
            description: "Backend HTTP error rate is {{ $value | humanizePercentage }} in the last 5 minutes."

        - alert: HPAMaxReplicasReached
          expr: |
            kube_horizontalpodautoscaler_status_current_replicas
            == kube_horizontalpodautoscaler_spec_max_replicas
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "HPA {{ $labels.horizontalpodautoscaler }} at max replicas"
            description: "HPA has reached maximum replicas. Consider increasing maxReplicas."
